; FoxMonitor client config
; Простое хранилище ключ=значение; строки, начинающиеся с ; или # — комментарии

host = 127.0.0.1
port = 8080

; Для подключения через интернет (Railway/VPS с HTTPS) раскомментируй:
;   host = ИМЯ-СЕРВЕРА.up.railway.app
;   tls = 1        ; wss:// (порт 443 подставится автоматически)
; и оставь client_key/пароль такими же, как на сервере.

client_id = pc1
client_key = secret123

; Кадров в секунду для экрана и камеры
screen_fps = 10
camera_fps = 5

; Качество JPEG (5..100)
jpeg_quality = 75

; Какие источники стримить при старте (1/0)
capture_screen = 1
capture_camera = 1

; Местоположение машины — показывается во вкладке «Инфо»
location = Офис 203, 3 этаж
